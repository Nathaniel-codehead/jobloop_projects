<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>netonnet</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div id="top_nav" class="flex_row">
                <div id="left_nav_container" class="flex_row">
                    <div class="flex_row">
                        <img class="icon" src="icons/phone.svg" alt="a phone">
                        <p>Kundeservice</p>
                    </div>
                    <div class="flex_row">
                        <img class="icon" src="icons/pin.svg" alt="a pin">
                        <p>Finn Lagershop og åpningstider</p>
                    </div>
                </div>
                <p>Handle som bedrift</p>
            </div>

            <div id="title_section" class="flex_row">
                <img id="net_on_net_logo" src="images/net_on_net.svg" alt="net on net logo">
                <div id="title_nav_container" class="flex_row">
                    <div class="flex_column">
                        <img src="icons/person.svg" alt="a person">
                        <p>Logg inn</p>
                    </div>
                    <div class="flex_column">
                        <img src="icons/shopping_cart.svg" alt="a person">
                        <p>Handlevogn</p>
                    </div>
                </div>
            </div>

            <div id="search_section" class="flex_row">
                <img src="icons/menu.svg" alt="">
                <p>Meny</p>
                <div id="searchbox" class="flex_row">
                    <img src="icons/search.svg" alt="a magnifying glass">
                    <p id="searchbox_placeholder">Søk produkter...</p>
                </div>
            </div>

            <div id="product_nav" class="flex_row">
                <div class="product_category_card flex_column">
                    <img src="icons/laptop.svg" alt="">
                    <p>Data og nettbrett</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/harddisk.svg" alt="">
                    <p>Datakomponenter</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/controller.svg" alt="">
                    <p>Gaming</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/vacuum.svg" alt="">
                    <p>Hjem og fritid</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/tv.svg" alt="">
                    <p>TV</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/earbuds.svg" alt="">
                    <p>Lyd</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/smart_phone.svg" alt="">
                    <p>Mobil og smartklokker</p>
                </div>
                <div class="product_category_card flex_column">
                    <img src="icons/hair_dryer.svg" alt="">
                    <p>Personlig pleie</p>
                </div>
            </div>
        </header>

        <main>
            <div id="image_container">
                <img src="images/dings.jpg" alt="">
            </div>
        </main>
    </body>
</html>
